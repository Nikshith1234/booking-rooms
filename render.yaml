services:
  - type: web
    name: booking-rooms
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn demo_room_booking.app:app
    envVars:
      - key: MONGO_URI
        sync: false        # Set this manually in Render dashboard
      - key: SECRET_KEY
        sync: false        # Set this manually in Render dashboard
