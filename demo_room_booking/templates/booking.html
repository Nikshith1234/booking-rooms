<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header-bar">
                <h1>Book a Room</h1>
                <a href="/dashboard" class="back-link">← Back to Dashboard</a>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="error-message">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="/booking">
                <div class="form-group">
                    <label for="room_number">Room Number</label>
                    <select id="room_number" name="room_number" required>
                        <option value="">-- Select a Room --</option>
                        {% for room in rooms %}
                        <option value="{{ room }}">Room {{ room }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="start_time">Start Time</label>
                    <input type="time" id="start_time" name="start_time" required>
                </div>

                <div class="form-group">
                    <label for="end_time">End Time</label>
                    <input type="time" id="end_time" name="end_time" required>
                </div>

                <div class="form-group">
                    <label for="num_people">Number of People</label>
                    <input type="number" id="num_people" name="num_people" min="1" max="50"
                        placeholder="Enter number of people" required>
                </div>

                <button type="submit" id="confirm_booking_button">Confirm Booking</button>
            </form>
        </div>
    </div>
</body>

</html>
